[project]
name = "ai-ml-curriculum"
version = "2026.1.0"
description = "Comprehensive Applied AI & LLM Systems Engineering Curriculum"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Data & Fast Analytics
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    
    # Modern Machine Learning & Tuning
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "catboost>=1.2.0",
    "optuna>=3.6.0",
    "shap>=0.45.0",
    
    # PyTorch & Computer Vision
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "timm>=1.0.0",
    "ultralytics>=8.2.0",
    
    # Transformers & Generative AI
    "transformers>=4.41.0",
    "tokenizers>=0.19.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "sentence-transformers>=3.0.0",
    
    # Vector DBs & RAG Architecture
    "chromadb>=0.5.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    
    # Agentic Systems & Orchestration
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "mcp>=1.0.0",
    
    # Observability & Evaluation
    "mlflow>=2.13.0",
    "ragas>=0.1.9",
    "langfuse>=2.35.0",
    
    # Serving & Web Dashboards
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
